# Control Parameters for DualArmMprcController with HQP and ConstraintManager
# Based on dual_arm_safe_controller_sim configuration

# ==========================================
# Control Gains
# ==========================================
K_joint_tracking: 2.0        # Joint tracking gain (for cost function)
K_joint_limit: 100.0         # Joint limit gain (K/dt, 100 Hz default)
K_collision_avoidance: 10.0  # Collision avoidance gain
K_relative_position: 10.0    # Relative position gain
K_relative_orientation: 10.0 # Relative orientation gain
K_tilt_limit: 10.0          # Tilt limit gain
K_singularity: 10.0          # Singularity avoidance gain

# ==========================================
# Joint Limits (14 DOF: robot1 + robot2)
# ==========================================
# Format: [robot1_j1...j7, robot2_j1...j7]

# Joint position limits (rad)
q_lb: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973,
       -2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
q_ub: [ 2.8973,  1.7628,  2.8973, -0.0698,  2.8973,  3.7525,  2.8973,
        2.8973,  1.7628,  2.8973, -0.0698,  2.8973,  3.7525,  2.8973]

# Joint velocity limits (rad/s) - adjusted for 1kHz control frequency
dq_lb: [-1.5, -1.5, -1.5, -1.5, -1.5, -1.5, -1.5,
        -1.5, -1.5, -1.5, -1.5, -1.5, -1.5, -1.5]
dq_ub: [ 1.5,  1.5,  1.5,  1.5,  1.5,  1.5,  1.5,
         1.5,  1.5,  1.5,  1.5,  1.5,  1.5,  1.5]

# Joint acceleration limits (rad/s²)
ddq_lb: [-5.0, -5.0, -5.0, -5.0, -5.0, -5.0, -5.0,
         -5.0, -5.0, -5.0, -5.0, -5.0, -5.0, -5.0]
ddq_ub: [ 5.0,  5.0,  5.0,  5.0,  5.0,  5.0,  5.0,
          5.0,  5.0,  5.0,  5.0,  5.0,  5.0,  5.0]

# ==========================================
# Penalty Weights (for HardSoftQP only)
# ==========================================
w_joint_limit: 100         # Joint limit penalty weight
w_collision_avoidance: 10  # Collision avoidance penalty weight
w_relative_position: 50    # Relative position penalty weight
w_relative_orientation: 50 # Relative orientation penalty weight
w_tilt_limit: 50           # Tilt limit penalty weight
w_singularity: 50          # Singularity avoidance penalty weight

# ==========================================
# Safety Parameters
# ==========================================
# These are used by individual safety constraints
# Collision safety distances are set in collision_env configuration
