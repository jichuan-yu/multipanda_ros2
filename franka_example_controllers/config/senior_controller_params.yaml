# 师兄控制器参数 - 匹配MuJoCo仿真
# 这些参数必须在师兄控制器启动前加载

# Robot 1 (panda_1, mj_left) base position in world frame
# Matches MuJoCo: <body name="mj_left_link0" pos="0 0.26 0">
/panda_1_xyz: [0.0, 0.26, 0.0]
/panda_1_rpy: [0.0, 0.0, 0.0]

# Robot 2 (panda_2, mj_right) base position in world frame
# Matches MuJoCo: <body name="mj_right_link0" pos="0 -0.26 0">
/panda_2_xyz: [0.0, -0.26, 0.0]
/panda_2_rpy: [0.0, 0.0, 0.0]

# Data recording (optional)
/data_record_ON: false
/data_record_path: "/tmp/senior_controller_data"
/data_record_prefix: "test_"
