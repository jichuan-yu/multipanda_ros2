# Units: metres, kg/m^3; quaternion order: [x, y, z, w].
# Use with dual_scene.xml's existing floor at z=0 (do not add another plane).
# Left/right use robot world axes: left=+Y, right=-Y.
# Broom stands on the support right (-Y) side and leans toward +Y by 10 degrees.
# The dustpan mouth faces +Y; its vertical handle is 10 cm beside the right home end effector. Tool parts are rigid, including the bristles.
# Tools and debris are movable and excluded from the static planner YAMLs.
description: "Floor cleaning: rigid broom, open dustpan, eight loose cubes and one narrow fixed support"
collision_objects:
