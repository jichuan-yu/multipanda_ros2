# Freely movable, with gravity exactly compensated. Controller export uses this initial pose.
- id: floating_sphere
  include_in_controller_collision: true
  type: Sphere
  dimensions: [0.05]  # Radius: 5 cm
  movable: true
  gravcomp: 1.0      # Default is 0.0 (gravity enabled)
  density: 500.0
  pose:
    position: [0.8, 0.0, 0.45]
  material:
    rgba: [0.8, 0.2, 0.8, 1.0]

# Task-space reference input. World +Y/-Y selects back_wall/front_wall after
# the tray's yaw transform; arm references still go through the safety controller.
tray_transport_input:
  tray: tray
  destination: right_stool
  grasp_tilt_degrees: 10.0  # modest forward lean keeps center grasps reachable; no 180-degree yaw
  transit_min_clearance: 0.025  # actual tray bottom above the higher seat before horizontal carry
  transport_xy_tolerance: 0.03  # enter placement when both inferred tray centers are within 3 cm
  transit_orientation_tolerance: 0.05
  grasp_min_overlap: 0.008  # minimum common finger-pad/wall vertical overlap (m)
  approach_clearance: 0.08
  transport_clearance: 0.06  # reserve reach margin for an accepted high wall grasp
  retreat_clearance: 0.06
  free_speed: 0.04       # m/s, upper bound before feedback slowdown
  carry_speed: 0.025
  min_playback_scale: 0.2  # keep advancing at >=20% after ramp, even with large tracking errors
  contact_speed: 0.008  # descent, lift and placement; protect stacked cubes
  # Short velocity ramps replace slow whole-segment quintic easing.
  motion_ramp_time: 0.5      # simulated seconds, each acceleration/deceleration ramp
  arrival_settle_time: 0.1
  grasp_settle_time: 0.25
  gripper_settle_time: 0.15
  cooperation_settle_time: 0.05
